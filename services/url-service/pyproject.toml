[project]
name = "url-service"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "scenario(capability, name): links a test to an OpenSpec scenario",
]
addopts = "-ra"
filterwarnings = [
    # Starlette 1.x suggests httpx2 for TestClient; httpx still works and is what we pin.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
